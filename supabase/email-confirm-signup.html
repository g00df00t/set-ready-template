<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;padding:0;background:#0f0f13;font-family:system-ui,-apple-system,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f13;padding:48px 24px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:40px;">
              <span style="font-size:16px;font-weight:700;letter-spacing:0.08em;color:#ffffff;">SET&gt;READY</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#16161f;border:1px solid #2a2a38;border-radius:12px;padding:40px 40px 36px;">

              <p style="margin:0 0 8px;font-size:20px;font-weight:600;color:#ffffff;line-height:1.3;">
                Confirm your email address
              </p>
              <p style="margin:0 0 32px;font-size:14px;color:#8888a0;line-height:1.6;">
                You're almost in. Click the button below to confirm your email and activate your SET&gt;READY account.
              </p>

              <!-- CTA Button -->
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:#4a6cf7;border-radius:8px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;padding:13px 28px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;letter-spacing:0.01em;">
                      Confirm email address
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:28px 0 0;font-size:12px;color:#555570;line-height:1.6;">
                If you didn't create a SET&gt;READY account, you can safely ignore this email.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:28px;">
              <p style="margin:0;font-size:11px;color:#333344;">
                &copy; SET&gt;READY &nbsp;&middot;&nbsp;
                <a href="https://www.set-ready-set.com" style="color:#333344;text-decoration:none;">www.set-ready-set.com</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
